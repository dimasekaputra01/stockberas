<style>
:root{--green:#19634b;--ink:#243d34;--muted:#819087;--line:#e5ebe6;--bg:#f6f8f5}*{box-sizing:border-box}body{margin:0;font:14px 'Segoe UI',Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}aside{width:230px;background:#fff;position:fixed;inset:0 auto 0 0;border-right:1px solid var(--line);padding:32px 22px;display:flex;flex-direction:column}.brand{font-size:29px;font-weight:750;letter-spacing:-1px;display:flex;align-items:center;gap:11px}.logo{background:var(--green);color:#fff;border-radius:13px;padding:7px 12px;font-size:27px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:500;margin-top:3px}.nav-label{font-size:10px;letter-spacing:1.8px;color:#9ba59f;margin:43px 12px 15px}nav button{display:flex;align-items:center;gap:13px;width:100%;border:0;background:transparent;padding:14px;border-radius:9px;color:#6a7971;text-align:left;margin-bottom:7px}nav button.active{background:#eaf3ed;color:var(--green);font-weight:650}nav button span{width:19px;font-size:18px}.aside-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:21px;font-size:12px;color:var(--muted)}.avatar{width:34px;height:34px;border-radius:50%;background:#e9efe8;display:grid;place-items:center;color:var(--green);font-weight:700}.profile{display:flex;align-items:center;gap:10px}.profile strong{display:block;color:var(--ink);font-size:12px}.profile small{font-size:11px;color:var(--muted)}main{margin-left:230px}header{height:80px;background:#fff;border-bottom:1px solid var(--line);padding:0 38px;display:flex;align-items:center;justify-content:space-between}.crumb{color:#8c9890;font-size:12px}.crumb b{color:#42594c;font-weight:500}.header-right{display:flex;align-items:center;gap:20px}.chip{font-size:11px;background:#f1f5ef;border:1px solid #e6ece3;border-radius:20px;padding:7px 12px}.page{max-width:1450px;margin:auto;padding:34px 38px}.heading{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:28px}h1{font-size:27px;letter-spacing:-.7px;margin:0 0 9px}h2{font-size:16px;margin:0}p{line-height:1.6;color:var(--muted);margin:5px 0}.btn{padding:11px 17px;border:1px solid var(--line);background:white;border-radius:8px;color:var(--ink);font-weight:600;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.btn:hover{filter:brightness(.96)}.buttons{display:flex;gap:9px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:22px;position:relative}.stat-icon{position:absolute;right:20px;top:20px;border-radius:10px;background:#f0f5ef;padding:10px;color:var(--green);font-size:19px}.stat label{color:#7d8b81;font-size:12px}.stat .value{font-size:32px;font-weight:650;letter-spacing:-1px;margin:16px 0 9px}.stat .value small{font-size:14px;font-weight:400;letter-spacing:0;color:var(--muted)}.stat .note{font-size:11px;color:#89988e}.dot{color:#41916a;margin-right:5px}.grid{display:grid;grid-template-columns:1.7fr 1fr;gap:23px;margin-bottom:24px}.card{background:white;border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-bottom:22px}.card-head{padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px}.card-head p{font-size:11px;margin-top:7px}.link{background:none;border:0;font-size:11px;color:var(--green);font-weight:600}.chart{padding:0 25px 24px}.bars{height:160px;display:flex;gap:24px;align-items:end;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0,transparent 39px,#f0f3ee 40px)}.bar-wrap{flex:1;text-align:center;position:relative;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center}.bar{width:65%;max-width:66px;background:#2d7859;border-radius:6px 6px 0 0;min-height:2px}.bar-wrap:nth-child(2n) .bar{background:#a9c6b2}.bar-value{font-size:10px;margin-bottom:7px}.bar-labels{display:flex;gap:24px;margin-top:12px;font-size:10px;color:#7a8b80}.bar-labels span{flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.activity{padding:0 23px 8px}.activity-item{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #f0f3ef}.activity-item:last-child{border:0}.activity-symbol{background:#f9f1e8;border-radius:9px;color:#b0874f;padding:9px}.activity-item strong{font-size:12px}.activity-item p{font-size:10px}.amount{margin-left:auto;white-space:nowrap;font-size:12px;font-weight:600;color:#98744b}.toolbar{display:flex;gap:12px;padding:0 24px 19px;align-items:center;flex-wrap:wrap}.search{flex:1;min-width:190px;max-width:350px}input,select{background:white;border:1px solid #dfe6df;border-radius:7px;padding:10px 12px;color:var(--ink);outline:none;min-width:0}input:focus,select:focus{border-color:#599778;box-shadow:0 0 0 3px #edf5ee}input::placeholder{color:#9aa59e;font-size:12px}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;text-align:left;white-space:nowrap;font-size:12px}th{background:#f7f9f6;color:#7b897f;font-size:10px;font-weight:500;letter-spacing:.3px;padding:14px 24px;border-block:1px solid var(--line)}td{padding:16px 24px;border-bottom:1px solid #edf1eb}tr:last-child td{border-bottom:0}.rice-name{font-weight:600;display:flex;align-items:center;gap:11px}.rice-icon{background:#f0f3e8;color:#91a06d;border:1px solid #e6ebd9;border-radius:8px;padding:7px;font-size:16px}.badge{display:inline-block;font-size:10px;border-radius:5px;padding:5px 8px;background:#eef4ee;color:#528366}.badge.warn{background:#fbf1e5;color:#ab8044}.badge.gray{background:#f0f2f1;color:#7f8c84}.table-footer{padding:15px 24px;color:#8c978f;font-size:10px;display:flex;justify-content:space-between;border-top:1px solid var(--line)}.action{background:transparent;border:0;color:#62816b;padding:5px;font-size:12px}.action.danger{color:#b56e63}.banner{background:#ecf3e9;border:1px solid #dde9d9;border-radius:11px;padding:19px 23px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.banner strong{font-size:13px}.banner p{font-size:11px;color:#819177}.foot{font-size:10px;color:#a0aaa2;display:flex;justify-content:space-between;margin-top:25px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:17px}.field{display:flex;flex-direction:column;gap:8px;font-size:12px}.full{grid-column:1/-1}.form-body{padding:24px}.help{background:#f1f6ef;padding:14px;border-radius:8px;font-size:12px;line-height:1.6}.physical{width:95px;padding:8px}.empty{text-align:center;padding:35px;color:var(--muted)}dialog{border:0;border-radius:16px;padding:0;width:490px;max-width:94vw;box-shadow:0 20px 90px #173c352a}dialog::backdrop{background:#192e2966;backdrop-filter:blur(3px)}dialog .card-head{border-bottom:1px solid var(--line)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#19634b;color:white;padding:14px 22px;border-radius:10px;box-shadow:0 7px 30px #0002;z-index:20;max-width:90vw;font-size:13px}.toast.error{background:#ad4944}.hidden{display:none!important}.report-options{display:grid;grid-template-columns:1fr 1fr;gap:22px}.report-card{padding:28px}.report-card h2{margin:17px 0 10px}.report-card p{font-size:12px;margin-bottom:25px}.intro-tag{color:#5c8269;font-size:11px;margin-bottom:12px}.mobile-brand{display:none}button:focus-visible{outline:3px solid #b2cfb9;outline-offset:2px}@media(max-width:1050px){aside{width:190px;padding:27px 15px}main{margin-left:190px}.page{padding:25px}.grid{grid-template-columns:1fr}.header-right .chip{display:none}th,td{padding:14px 18px}}@media(max-width:700px){aside{position:static;width:auto;padding:16px;border-right:0;border-bottom:1px solid var(--line)}.brand{font-size:24px}.brand small,.nav-label,.aside-foot{display:none}nav{display:flex;gap:4px;overflow-x:auto;margin-top:18px}nav button{white-space:nowrap;margin:0;padding:10px;justify-content:center;font-size:11px}nav button span{display:none}main{margin:0}header{height:53px;padding:0 18px}.page{padding:23px 16px}.heading{align-items:start;flex-direction:column;margin-bottom:21px}h1{font-size:25px}.stats{gap:8px}.stat{padding:15px 10px}.stat-icon{display:none}.stat label{font-size:10px}.stat .value{font-size:23px}.stat .note{font-size:9px}.stat .value small{font-size:10px}.card-head{padding:19px 16px}.toolbar{padding:0 16px 16px}.banner{gap:12px;padding:15px}.banner .btn{white-space:nowrap}.report-options{grid-template-columns:1fr}.foot{gap:15px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.header-right .profile{display:none}}

<body>
<aside><div class="brand"><span class="logo">♧</span><div>butir<span style="color:#81a181">.</span><small>MANAJEMEN GUDANG</small></div></div><div class="nav-label">MENU UTAMA</div><nav id="nav"></nav><div class="aside-foot"><div class="profile"><div class="avatar">A</div><div><strong>Admin Gudang</strong><small>Pengelola stok</small></div></div><p style="margin-top:22px;font-size:10px">Butir · Lebih tertata, lebih mudah.</p></div></aside>
<main><header><div class="crumb">Gudang beras <span style="margin:0 10px">/</span> <b id="breadcrumb">Dashboard</b></div><div class="header-right"><span class="chip">● &nbsp; Gudang Utama</span><span id="today" style="font-size:11px;color:#89958b"></span><div class="avatar">A</div></div></header><div class="page" id="app"></div></main>
<dialog id="riceModal"><div class="card-head"><h2 id="modalTitle">Tambah data beras</h2><button class="action" onclick="document.getElementById('riceModal').close()" aria-label="Tutup">✕</button></div><form id="riceForm" class="form-body"><input type="hidden" id="editId"><div class="form-grid"><label class="field full">Nama beras<input id="riceName" required maxlength="70" placeholder="Contoh: Beras Pandan Wangi"></label><label class="field">Kategori<input id="riceCategory" list="categories" required maxlength="40" placeholder="Pilih atau ketik kategori"><datalist id="categories"><option>Premium</option><option>Medium</option><option>Organik</option><option>Ketan</option></datalist></label><label class="field">Satuan<select id="riceUnit"><option>kg</option><option>karung</option><option>liter</option></select></label><label class="field full">Jumlah stok<input id="riceStock" type="number" min="0" step="0.01" required placeholder="0"></label><div class="help full">Stok dikelola tanpa harga. Gunakan satuan yang sama saat pengeluaran dan stok opname.</div><div class="buttons full" style="justify-content:flex-end"><button type="button" class="btn" onclick="document.getElementById('riceModal').close()">Batal</button><button class="btn primary">Simpan data beras</button></div></div></form></dialog>
<div id="toast" class="toast hidden" role="alert"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), num=n=>Number(n).toLocaleString('id-ID',{maximumFractionDigits:2}), round=n=>Math.round(n*100)/100;
const localDate=()=>{let d=new Date();return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}, dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'});
let rice=[{id:1,name:'Pandan Wangi',category:'Premium',unit:'kg',stock:1250},{id:2,name:'Rojolele',category:'Premium',unit:'kg',stock:850},{id:3,name:'IR 64',category:'Medium',unit:'kg',stock:2100},{id:4,name:'Beras Merah',category:'Organik',unit:'kg',stock:320},{id:5,name:'Ketan Putih',category:'Ketan',unit:'kg',stock:480}];
let history=[{date:localDate(),name:'Pandan Wangi',unit:'kg',amount:50,note:'Pengambilan pelanggan',id:1},{date:localDate(),name:'IR 64',unit:'kg',amount:100,note:'Pengambilan pelanggan',id:3},{date:localDate(),name:'Rojolele',unit:'kg',amount:25,note:'Pengambilan pelanggan',id:2}], physical={}, page='Dashboard', search='', category='', historyDate='';
let saved=false;try{const d=JSON.parse(localStorage.getItem('butir-v1'));if(d&&Array.isArray(d.rice)&&Array.isArray(d.history)){rice=d.rice;history=d.history;physical=d.physical||{};}saved=true}catch(e){}
function save(){try{localStorage.setItem('butir-v1',JSON.stringify({rice,history,physical}));return true}catch(e){saved=false;return false}}
function toast(message,error=false){$('#toast').textContent=message;$('#toast').className='toast'+(error?' error':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4200)}
const pages=[['Dashboard','▦'],['Data Beras','▤'],['Stok Keluar','↗'],['Stok Opname','☷'],['Laporan PDF','▧']];
function go(p){page=p;search='';category='';render()}
function totals(items=rice){let result={};items.forEach(r=>result[r.unit]=round((result[r.unit]||0)+r.stock));return Object.entries(result).map(([u,n])=>num(n)+' '+u).join(' · ')||'0'}
function mismatch(r){return physical[r.id]!==undefined?round(physical[r.id]-r.stock):null}
function diffTotals(){let values={};rice.forEach(r=>{let d=mismatch(r);if(d!==null)values[r.unit]=round((values[r.unit]||0)+Math.abs(d))});return Object.entries(values).map(([u,n])=>num(n)+' '+u).join(' · ')||'0'}
function heading(title,desc,actions=''){return `<div class="heading"><div><h1>${title}</h1><p>${desc}</p></div><div class="buttons">${actions}</div></div>`}
function stats(){return `<div class="stats"><div class="stat"><label>Total jenis beras</label><span class="stat-icon">▦</span><div class="value">${rice.length} <small>jenis</small></div><div class="note"><span class="dot">●</span>Terdaftar di gudang</div></div><div class="stat"><label>Total stok tersedia</label><span class="stat-icon">▤</span><div class="value" style="font-size:${totals().length>19?'20':'32'}px">${totals()}</div><div class="note"><span class="dot">●</span>Dikelompokkan per satuan</div></div><div class="stat"><label>Total selisih opname</label><span class="stat-icon">≋</span><div class="value" style="font-size:28px">${diffTotals()}</div><div class="note">Selisih absolut · ${rice.filter(r=>mismatch(r)!==null).length}/${rice.length} jenis diperiksa</div></div></div>`}
function filtered(){return rice.filter(r=>(r.name+' '+r.category).toLowerCase().includes(search.toLowerCase())&&(!category||r.category===category))}
function filters(){return `<div class="toolbar"><input class="search" aria-label="Cari beras" placeholder="⌕  Cari nama atau kategori beras..." value="${esc(search)}" oninput="search=this.value;updateRows()"><select aria-label="Filter kategori" onchange="category=this.value;updateRows()"><option value="">Semua kategori</option>${[...new Set(rice.map(r=>r.category))].map(c=>`<option ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><span style="margin-left:auto;font-size:11px;color:#89958b">Tanpa pengelolaan harga</span></div>`}
function stockRows(){return filtered().map(r=>`<tr><td><div class="rice-name"><span class="rice-icon">♧</span>${esc(r.name)}</div></td><td>${esc(r.category)}</td><td>${esc(r.unit)}</td><td><strong>${num(r.stock)}</strong></td><td><span class="badge ${r.stock===0?'warn':''}">${r.stock===0?'Stok habis':'Tersedia'}</span></td><td><button class="action" onclick="openRice(${r.id})">Edit</button><button class="action danger" onclick="removeRice(${r.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Tidak ada data beras yang ditemukan.</td></tr>'}
function opnameRows(){return filtered().map(r=>{let d=mismatch(r);return `<tr><td><strong>${esc(r.name)}</strong></td><td>${esc(r.category)}</td><td>${esc(r.unit)}</td><td>${num(r.stock)}</td><td><input aria-label="Stok fisik ${esc(r.name)}" class="physical" type="number" min="0" step="0.01" placeholder="Belum diisi" value="${physical[r.id]??''}" onchange="setPhysical(${r.id},this)"></td><td>${d===null?'—':(d>0?'+':'')+num(d)}</td><td><span class="badge ${d===null?'gray':d!==0?'warn':''}">${d===null?'Belum diperiksa':d===0?'Cocok':'Tidak cocok'}</span></td></tr>`}).join('')||'<tr><td colspan="7" class="empty">Tidak ada data beras.</td></tr>'}
function updateRows(){ $('#rows').innerHTML=page==='Stok Opname'?opnameRows():stockRows();$('#count').textContent=`Menampilkan ${filtered().length} dari ${rice.length} jenis beras` }
function stockTable(){return `<section class="card"><div class="card-head"><div><h2>Daftar stok beras</h2><p>Pantau dan kelola semua persediaan gudang Anda.</p></div><span class="badge gray">${rice.length} jenis beras</span></div>${filters()}<div class="table-wrap"><table><thead><tr><th>NAMA BERAS</th><th>KATEGORI</th><th>SATUAN</th><th>STOK TERSEDIA</th><th>STATUS</th><th>AKSI</th></tr></thead><tbody id="rows">${stockRows()}</tbody></table></div><div class="table-footer"><span id="count">Menampilkan ${filtered().length} dari ${rice.length} jenis beras</span><span>Stok diperbarui otomatis</span></div></section>`}
function dashboard(){let max=Math.max(1,...rice.map(r=>r.stock));let chart=rice.filter(r=>r.unit==='kg').slice(0,6);max=Math.max(1,...chart.map(r=>r.stock));return heading('Ringkasan gudang','Selamat datang, Admin. Berikut kondisi stok beras Anda hari ini.',`<button class="btn" onclick="exportPDF('stok')">↓ &nbsp; Unduh laporan</button><button class="btn primary" onclick="openRice()">＋ Tambah beras</button>`)+stats()+`<div class="grid"><section class="card" style="margin:0"><div class="card-head"><div><h2>Persediaan beras</h2><p>Jumlah stok per jenis beras dalam kilogram</p></div><span class="badge gray">Stok saat ini</span></div><div class="chart"><div class="bars">${chart.map(r=>`<div class="bar-wrap"><div class="bar-value">${num(r.stock)}</div><div class="bar" style="height:${r.stock/max*120}px"></div></div>`).join('')}</div><div class="bar-labels">${chart.map(r=>`<span>${esc(r.name)}</span>`).join('')}</div>${!chart.length?'<p>Tidak ada stok dengan satuan kg.</p>':''}</div></section><section class="card" style="margin:0"><div class="card-head"><h2>Aktivitas terakhir</h2><button class="link" onclick="go('Stok Keluar')">Lihat semua →</button></div><div class="activity">${history.slice(0,3).map(h=>`<div class="activity-item"><span class="activity-symbol">↗</span><div><strong>${esc(h.name)}</strong><p>${dateLabel(h.date)} · Stok keluar</p></div><div class="amount">−${num(h.amount)} ${esc(h.unit)}</div></div>`).join('')||'<p>Belum ada pengeluaran stok.</p>'}</div></section></div><div class="banner"><div><strong>Stok gudang sudah sesuai?</strong><p>Lakukan stok opname untuk mencocokkan persediaan fisik dengan sistem.</p></div><button class="btn" onclick="go('Stok Opname')">Mulai opname →</button></div>`+stockTable()}
function outPage(){return heading('Stok keluar','Catat pengambilan beras. Stok akan berkurang secara otomatis.')+`<section class="card"><div class="card-head"><h2>Catat pengambilan baru</h2><span class="badge">Validasi stok aktif</span></div><form class="form-body" onsubmit="submitOut(event)"><div class="form-grid"><label class="field">Nama beras<select id="outRice" required onchange="available()"><option value="">Pilih beras</option>${rice.map(r=>`<option value="${r.id}">${esc(r.name)} — ${num(r.stock)} ${esc(r.unit)}</option>`).join('')}</select></label><label class="field">Tanggal pengambilan<input id="outDate" type="date" required value="${localDate()}" max="${localDate()}"></label><label class="field">Jumlah yang diambil<input id="outAmount" type="number" min="0.01" step="0.01" required placeholder="Masukkan jumlah"></label><label class="field">Catatan (opsional)<input id="outNote" maxlength="140" placeholder="Contoh: Pengambilan pelanggan"></label><div class="help" id="available">Pilih beras untuk melihat stok tersedia.</div><div class="buttons" style="justify-content:flex-end;align-items:center"><button class="btn primary" ${rice.length?'':'disabled'}>↗ Simpan stok keluar</button></div></div></form></section><section class="card"><div class="card-head"><div><h2>Riwayat stok keluar</h2><p>Catatan pengambilan disimpan meskipun data beras dihapus.</p></div><input aria-label="Filter tanggal riwayat" type="date" value="${historyDate}" onchange="historyDate=this.value;render()"><button class="link" onclick="historyDate='';render()">Semua</button></div><div class="table-wrap"><table><thead><tr><th>TANGGAL</th><th>NAMA BERAS</th><th>JUMLAH</th><th>SATUAN</th><th>CATATAN</th></tr></thead><tbody>${history.filter(h=>!historyDate||h.date===historyDate).map(h=>`<tr><td>${dateLabel(h.date)}</td><td><strong>${esc(h.name)}</strong></td><td>${num(h.amount)}</td><td>${esc(h.unit)}</td><td>${esc(h.note||'—')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Belum ada pengeluaran pada tanggal ini.</td></tr>'}</tbody></table></div></section>`}
function opnamePage(){return heading('Stok opname','Cocokkan stok sistem dengan jumlah fisik di gudang.',`<button class="btn" onclick="fillPhysical()">Isi sesuai sistem</button><button class="btn primary" onclick="exportPDF('opname')">↓ Unduh PDF opname</button>`)+stats()+`<div class="banner"><div><strong>Masukkan jumlah fisik, selisih dihitung otomatis.</strong><p>Selisih = stok fisik − stok sistem. Isian disimpan otomatis dan tidak mengubah stok sistem.</p></div></div><section class="card"><div class="card-head"><h2>Pencocokan persediaan</h2><span class="badge gray">${dateLabel(localDate())}</span></div>${filters()}<div class="table-wrap"><table><thead><tr><th>NAMA BERAS</th><th>KATEGORI</th><th>SATUAN</th><th>STOK SISTEM</th><th>STOK FISIK</th><th>SELISIH</th><th>STATUS</th></tr></thead><tbody id="rows">${opnameRows()}</tbody></table></div><div class="table-footer"><span id="count">Menampilkan ${filtered().length} dari ${rice.length} jenis beras</span><span>Isian kosong = belum diperiksa</span></div></section><div class="buttons"><button class="btn" onclick="clearPhysical()">Mulai opname baru</button><button class="btn primary" onclick="reconcile()">Sesuaikan stok sistem dengan fisik</button></div><p style="font-size:11px;margin-top:12px">Unduh hasil pencocokan sebelum penyesuaian untuk menyimpan selisih periode ini.</p>`}
function reportPage(){return heading('Laporan PDF','Unduh laporan persediaan dan hasil pencocokan untuk arsip gudang.')+stats()+`<div class="report-options"><section class="card report-card"><span class="stat-icon" style="position:static;display:inline-block">▤</span><h2>Laporan stok akhir</h2><p>Daftar lengkap nama beras, kategori, satuan, stok tersedia, dan total stok per satuan.</p><button class="btn primary" onclick="exportPDF('stok')">↓ Unduh PDF stok akhir</button></section><section class="card report-card"><span class="stat-icon" style="position:static;display:inline-block">☷</span><h2>Laporan stok opname</h2><p>Stok sistem, stok fisik, selisih, dan status cocok atau tidak cocok untuk setiap jenis beras.</p><button class="btn primary" onclick="exportPDF('opname')">↓ Unduh PDF pencocokan</button></section></div><div class="banner"><div><strong>Satu dokumen, ringkasan lengkap.</strong><p>Gabungkan stok akhir dan hasil opname dalam satu laporan PDF.</p></div><button class="btn" onclick="exportPDF('lengkap')">↓ PDF lengkap</button></div><p style="font-size:12px">Laporan mencakup seluruh data, tanpa mengikuti filter pencarian. Dibuat pada ${dateLabel(localDate())}.</p>`}
function render(){ $('#nav').innerHTML=pages.map(([p,i])=>`<button class="${p===page?'active':''}" onclick="go('${p}')"><span>${i}</span>${p}</button>`).join('');$('#breadcrumb').textContent=page;$('#today').textContent=dateLabel(localDate());$('#app').innerHTML=(page==='Dashboard'?dashboard():page==='Data Beras'?heading('Data beras','Kelola jenis beras dan persediaan gudang dalam satu tempat.',`<button class="btn primary" onclick="openRice()">＋ Tambah beras</button>`)+stockTable():page==='Stok Keluar'?outPage():page==='Stok Opname'?opnamePage():reportPage())+`<footer class="foot"><span>Butir · Manajemen stok gudang beras</span><span>${saved?'Data tersimpan di browser ini':'Mode sesi · Unduh laporan sebelum menutup'} · Tanpa harga</span></footer>` }
function openRice(id){let r=rice.find(r=>r.id===id);$('#riceForm').reset();$('#editId').value=r?.id||'';$('#modalTitle').textContent=r?'Edit data beras':'Tambah data beras';$('#riceName').value=r?.name||'';$('#riceCategory').value=r?.category||'';$('#riceUnit').value=r?.unit||'kg';$('#riceStock').value=r?.stock??'';$('#riceModal').showModal()}
$('#riceForm').addEventListener('submit',e=>{e.preventDefault();let id=Number($('#editId').value),name=$('#riceName').value.trim(),cat=$('#riceCategory').value.trim(),unit=$('#riceUnit').value,stock=Number($('#riceStock').value);if(!name||!cat||!Number.isFinite(stock)||stock<0)return toast('Nama, kategori, dan stok nonnegatif harus diisi.',true);if(rice.some(r=>r.id!==id&&r.name.toLowerCase()===name.toLowerCase()&&r.unit===unit))return toast('Beras dengan nama dan satuan tersebut sudah terdaftar.',true);let old=rice.find(r=>r.id===id);if(old){if(old.stock!==stock||old.unit!==unit)delete physical[id];Object.assign(old,{name,category:cat,unit,stock:round(stock)})}else rice.push({id:Date.now(),name,category:cat,unit,stock:round(stock)});save();$('#riceModal').close();render();toast('Data beras berhasil disimpan.')});
function removeRice(id){let r=rice.find(r=>r.id===id);if(!confirm(`Hapus ${r.name} dengan stok ${num(r.stock)} ${r.unit}? Riwayat pengambilan tetap disimpan.`))return;rice=rice.filter(r=>r.id!==id);delete physical[id];save();render();toast('Data beras dihapus.')}
function available(){let r=rice.find(r=>r.id===Number($('#outRice').value));$('#available').textContent=r?`Stok tersedia: ${num(r.stock)} ${r.unit}. Pengambilan tidak boleh melebihi stok.`:'Pilih beras untuk melihat stok tersedia.'}
function submitOut(e){e.preventDefault();let r=rice.find(r=>r.id===Number($('#outRice').value)),amount=Number($('#outAmount').value),date=$('#outDate').value;if(!r||!Number.isFinite(amount)||amount<=0)return toast('Pilih beras dan masukkan jumlah lebih dari nol.',true);if(amount>r.stock)return toast(`Stok tidak mencukupi. Tersedia hanya ${num(r.stock)} ${r.unit}.`,true);if(!date||date>localDate())return toast('Tanggal pengambilan tidak boleh di masa depan.',true);r.stock=round(r.stock-amount);delete physical[r.id];history.unshift({id:r.id,name:r.name,unit:r.unit,amount:round(amount),date,note:$('#outNote').value.trim()});history.sort((a,b)=>b.date.localeCompare(a.date));save();render();toast('Pengambilan tersimpan. Stok otomatis berkurang; opname beras ini perlu diperiksa ulang.')}
function setPhysical(id,input){if(input.value===''){delete physical[id]}else{let n=Number(input.value);if(!Number.isFinite(n)||n<0||!input.validity.valid){toast('Stok fisik harus berupa angka nonnegatif, maksimal 2 desimal.',true);input.value=physical[id]??'';return}physical[id]=round(n)}save();render()}
function fillPhysical(){if(!confirm('Isi semua stok fisik menggunakan stok sistem? Isian sebelumnya akan diganti.'))return;rice.forEach(r=>physical[r.id]=r.stock);save();render();toast('Stok fisik diisi. Pastikan sesuai hitungan gudang.')}
function clearPhysical(){if(!confirm('Hapus isian opname dan mulai pencocokan baru? Unduh laporan sebelumnya terlebih dahulu.'))return;physical={};save();render()}
function reconcile(){let checked=rice.filter(r=>mismatch(r)!==null);if(!checked.length)return toast('Isi stok fisik terlebih dahulu.',true);if(!confirm(`Sesuaikan stok sistem untuk ${checked.length} jenis beras yang diperiksa? Selisih akan menjadi nol. Pastikan laporan sebelum penyesuaian sudah diunduh.`))return;checked.forEach(r=>r.stock=physical[r.id]);save();render();toast('Stok sistem telah disesuaikan dengan stok fisik.')}
function exportPDF(type){if(!window.jspdf){toast('Pustaka PDF belum tersedia. Periksa koneksi internet lalu muat ulang halaman.',true);return}const doc=new window.jspdf.jsPDF({orientation:'landscape',unit:'mm',format:'a4'});let y=0;const width=267;function top(title){doc.setFillColor(25,99,75);doc.rect(0,0,297,32,'F');doc.setTextColor(255);doc.setFont('helvetica','bold');doc.setFontSize(21);doc.text('butir. | '+title,15,16);doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text('Gudang Utama  |  '+dateLabel(localDate())+'  |  Tanpa harga',15,24);doc.setTextColor(45,60,50);y=43}function section(title,headers,rows,widths){doc.setFontSize(12);doc.setFont('helvetica','bold');doc.text(title,15,y);y+=7;function head(){let x=15;doc.setFillColor(235,241,234);doc.rect(15,y,width,10,'F');doc.setFontSize(8);doc.setFont('helvetica','bold');headers.forEach((h,i)=>{doc.text(h,x+3,y+6);x+=widths[i]});y+=10}head();rows.forEach((row,idx)=>{doc.setFontSize(9);doc.setFont('helvetica','normal');const lines=row.map((v,i)=>doc.splitTextToSize(String(v),widths[i]-6));let height=Math.max(11,...lines.map(l=>l.length*4+5));if(y+height>190){doc.addPage();top('Laporan gudang');head()}if(idx%2===0){doc.setFillColor(248,250,247);doc.rect(15,y,width,height,'F')}let x=15;lines.forEach((l,i)=>{doc.text(l,x+3,y+6);x+=widths[i]});y+=height});if(!rows.length){doc.setFont('helvetica','normal');doc.text('Belum ada data.',18,y+7);y+=13}y+=12}
 top(type==='stok'?'Laporan stok akhir':type==='opname'?'Laporan stok opname':'Laporan stok dan opname');
 if(type!=='opname'){section('Persediaan beras',[ 'Nama beras','Kategori','Satuan','Stok tersedia'],rice.map(r=>[r.name,r.category,r.unit,num(r.stock)]),[100,67,40,60]);if(y>183){doc.addPage();top('Ringkasan stok')}doc.setFontSize(10);doc.text('Total stok per satuan: '+totals(),15,y);y+=13}
 if(type!=='stok'){if(type==='lengkap'){doc.addPage();top('Laporan stok opname')}section('Hasil pencocokan stok',[ 'Nama beras','Kategori','Satuan','Stok sistem','Stok fisik','Selisih','Status'],rice.map(r=>{let d=mismatch(r);return[r.name,r.category,r.unit,num(r.stock),d===null?'-':num(physical[r.id]),d===null?'-':(d>0?'+':'')+num(d),d===null?'Belum diperiksa':d===0?'Cocok':'Tidak cocok']}),[61,39,22,34,34,30,47]);if(y>178){doc.addPage();top('Ringkasan opname')}doc.setFontSize(10);doc.text('Total selisih absolut per satuan: '+diffTotals(),15,y);doc.setFontSize(9);doc.text('Selisih = stok fisik - stok sistem. Isian kosong belum diperiksa.',15,y+8)}
 let n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setDrawColor(220);doc.line(15,197,282,197);doc.setFontSize(8);doc.setTextColor(120);doc.text('Butir - Manajemen stok gudang beras',15,203);doc.text('Halaman '+i+' / '+n,282,203,{align:'right'})}doc.save('butir-'+type+'-'+localDate()+'.pdf');toast('Laporan PDF berhasil dibuat.')}
render();
</script>
</body>
</html>
